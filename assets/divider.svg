<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%" height="40" preserveAspectRatio="none">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#7F5AF0" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .wave {
      animation: waveMotion 4s ease-in-out infinite alternate;
    }
    @keyframes waveMotion {
      0% {
        d: path("M 0 20 Q 250 10, 500 20 T 1000 20");
      }
      100% {
        d: path("M 0 20 Q 250 30, 500 20 T 1000 20");
      }
    }
  </style>
  <path class="wave" d="M 0 20 Q 250 15, 500 20 T 1000 20" fill="none" stroke="url(#divider-grad)" stroke-width="2" filter="url(#glow)" />
  <circle cx="500" cy="20" r="4" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
