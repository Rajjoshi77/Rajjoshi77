<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear Gradients -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#7F5AF0" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glassmorphic Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    /* Typography */
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&amp;family=Fira+Code:wght@400;500;700&amp;display=swap');
    
    .title-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 38px;
      fill: url(#neon-grad);
      letter-spacing: 4px;
    }
    
    .terminal-text {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      fill: #00F5FF;
      opacity: 0.85;
    }

    .subtitle-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #FFFFFF;
      letter-spacing: 2px;
      opacity: 0.9;
    }

    /* Grid & Card Animations */
    .glowing-rect {
      stroke: url(#neon-grad);
      animation: borderGlow 6s infinite alternate;
    }

    @keyframes borderGlow {
      0% { stroke-opacity: 0.3; filter: drop-shadow(0 0 2px rgba(0, 245, 255, 0.2)); }
      100% { stroke-opacity: 0.9; filter: drop-shadow(0 0 10px rgba(127, 90, 240, 0.6)); }
    }

    /* Terminal Typing Animations */
    .type-line1 {
      animation: type1 8s steps(40) infinite;
      white-space: nowrap;
      overflow: hidden;
    }
    .type-line2 {
      animation: type2 8s steps(40) infinite;
      white-space: nowrap;
      overflow: hidden;
    }
    .type-line3 {
      animation: type3 8s steps(40) infinite;
      white-space: nowrap;
      overflow: hidden;
    }

    @keyframes type1 {
      0%, 10% { opacity: 0; width: 0; }
      15%, 90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes type2 {
      0%, 35% { opacity: 0; }
      40%, 90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes type3 {
      0%, 65% { opacity: 0; }
      70%, 90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }

    /* Floating Node Icons & Particle Lines */
    .node-particle {
      animation: floatNode 8s infinite ease-in-out;
    }
    .node-particle-delayed {
      animation: floatNode 8s infinite ease-in-out;
      animation-delay: -4s;
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(5px); }
    }

    /* Cursor Blinking */
    .cursor {
      animation: blink 0.8s infinite;
      fill: #00F5FF;
    }
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Cyberpunk Scanline Effect */
    .scanline {
      width: 100%;
      height: 2px;
      fill: rgba(0, 245, 255, 0.15);
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { y: 10px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { y: 230px; opacity: 0; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="100%" height="100%" fill="#0D1117" rx="16" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Outer Glass Frame with Glowing Gradient Border -->
  <rect x="10" y="10" width="780" height="220" fill="none" stroke-width="1.5" rx="12" class="glowing-rect" />

  <!-- Cyberpunk Scanline -->
  <rect class="scanline" x="12" y="12" width="776" height="2" />

  <!-- Background Glowing Orbs (Soft Mesh Gradients) -->
  <circle cx="150" cy="120" r="80" fill="#00F5FF" opacity="0.08" filter="blur(40px)" />
  <circle cx="650" cy="120" r="90" fill="#7F5AF0" opacity="0.1" filter="blur(50px)" />

  <!-- Terminal Style Header Bar -->
  <g transform="translate(25, 25)">
    <!-- Terminal window controls -->
    <circle cx="10" cy="10" r="5" fill="#FF5F56" />
    <circle cx="25" cy="10" r="5" fill="#FFBD2E" />
    <circle cx="40" cy="10" r="5" fill="#27C93F" />
    <text x="65" y="14" font-family="'Fira Code', monospace" font-size="11" fill="#7F5AF0" opacity="0.7">root@hyperion:~</text>
  </g>

  <!-- Animated Decorative Floating Particles/Nodes -->
  <g class="node-particle" opacity="0.4">
    <line x1="560" y1="60" x2="620" y2="90" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
    <line x1="620" y1="90" x2="600" y2="150" stroke="rgba(127, 90, 240, 0.2)" stroke-width="1" />
    <circle cx="560" cy="60" r="3" fill="#00F5FF" filter="url(#glow-cyan)"/>
    <circle cx="620" cy="90" r="4" fill="#7F5AF0" filter="url(#glow-purple)"/>
    <circle cx="600" cy="150" r="3" fill="#A855F7" />
  </g>
  <g class="node-particle-delayed" opacity="0.3">
    <line x1="680" y1="180" x2="720" y2="130" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1" />
    <line x1="720" y1="130" x2="700" y2="80" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
    <circle cx="680" cy="180" r="3.5" fill="#A855F7" filter="url(#glow-purple)"/>
    <circle cx="720" cy="130" r="2.5" fill="#00F5FF" />
    <circle cx="700" cy="80" r="4" fill="#7F5AF0" filter="url(#glow-cyan)"/>
  </g>

  <!-- Left Side: Terminal Log / Status Stream -->
  <g transform="translate(35, 75)">
    <!-- Log Line 1 -->
    <g class="type-line1">
      <text x="0" y="15" class="terminal-text">&gt; INITIALIZING COGNITIVE INTERFACE...</text>
      <text x="315" y="15" class="terminal-text" fill="#27C93F">[OK]</text>
    </g>
    <!-- Log Line 2 -->
    <g class="type-line2">
      <text x="0" y="40" class="terminal-text">&gt; MOUNTING NEURAL CORE NETWORKS...</text>
      <text x="300" y="40" class="terminal-text" fill="#27C93F">[READY]</text>
    </g>
    <!-- Log Line 3 -->
    <g class="type-line3">
      <text x="0" y="65" class="terminal-text">&gt; CONNECTING SYNERGY SOCKETS...</text>
      <text x="270" y="65" class="terminal-text" fill="#00F5FF">[ONLINE]</text>
    </g>
    <!-- Static Active Indicators -->
    <text x="0" y="100" class="terminal-text" fill="#7F5AF0" font-weight="bold">&gt; HOST_STABILITY: 99.98% // BANDWIDTH: MAX</text>
  </g>

  <!-- Right Side: Big Brand Title and Focus -->
  <g transform="translate(420, 95)">
    <!-- Glow behind the title -->
    <text x="0" y="25" class="title-text" filter="url(#glow-cyan)" opacity="0.3">HYPERION</text>
    <!-- Real Title -->
    <text x="0" y="25" class="title-text">HYPERION</text>
    
    <text x="3" y="60" class="subtitle-text">SYSTEM ARCHITECT &amp; AI ENGINEER</text>
    
    <!-- Pulse Indicator and Active Status -->
    <g transform="translate(3, 85)">
      <circle cx="6" cy="-4" r="4" fill="#00F5FF">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="0" font-family="'Fira Code', monospace" font-size="11" fill="#FFFFFF" opacity="0.6">PORT: 8080 // LOC: GRID_0X7F</text>
    </g>
  </g>

  <!-- Custom Tech Symbol Overlays (Bottom corners decoration) -->
  <path d="M 750 200 L 770 200 L 770 180" fill="none" stroke="#7F5AF0" stroke-width="2" opacity="0.6" />
  <path d="M 50 200 L 30 200 L 30 180" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.6" />
</svg>
